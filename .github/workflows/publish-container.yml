# Build and publish the WorthLog production image to GitHub Container Registry.
#
# Triggers:
#   - Push of a version tag matching v*.*.* (e.g. v1.2.3)
#   - Manual workflow_dispatch
#
# Image: ghcr.io/gittheums/worthlog  (lowercase; required by GHCR)

name: Publish container

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  IMAGE_NAME: ghcr.io/gittheums/worthlog

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # v1.2.3 → 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest only from version tags, or manual runs on main
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            # Optional sha tag for manual runs (any branch; never overwrites :latest on feature branches)
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=WorthLog
            org.opencontainers.image.description=Self-hosted investment value logging application
            org.opencontainers.image.source=https://github.com/GitTheums/WorthLog
          # Do not set org.opencontainers.image.licenses — repository has no LICENSE file.
          # revision/version labels are generated by docker/metadata-action from git.

      - name: Ensure tags were generated
        run: |
          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "No image tags were generated for this event. Aborting."
            exit 1
          fi
          echo "Publishing tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations help consumers verify how the image was built.
          provenance: true
